spring.application.name=proyectoAquachile

server.port=8080

# Conexión a MySQL en Docker
spring.datasource.url=jdbc:mysql://localhost:3306/aquachile_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

AQUACHILE_ANALISTA_PASSWORD=admin123
AQUACHILE_EVALUADOR_PASSWORD=user123

# Límite de archivos CV (PDF, DOC y DOCX)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
