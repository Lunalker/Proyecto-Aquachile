spring.application.name=proyectoAquachile
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/aquachile?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=30000

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# Credenciales de demostración (siempre desde entorno en despliegue)
aquachile.analista.password=${AQUACHILE_ANALISTA_PASSWORD:admin123}
aquachile.evaluador.password=${AQUACHILE_EVALUADOR_PASSWORD:user123}

# Límite de archivos CV (PDF, DOC y DOCX)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Configuración de Gmail SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Proveedor Principal (Google Gemini con autodescubrimiento de modelos activos)
groq.api.url=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
groq.api.key=${GEMINI_API_KEY:}
groq.api.model=gemini-3-flash-preview,gemini-2.5-flash-lite,gemini-3.1-flash-lite-preview

# Proveedor de Respaldo Automático (Groq, si GROQ_API_KEY está presente en .env)
groq.fallback.url=https://api.groq.com/openai/v1/chat/completions
groq.fallback.key=${GROQ_API_KEY:}
groq.fallback.model=meta-llama/llama-4-scout-17b-16e-instruct,llama-3.3-70b-versatile

spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# Parámetros operativos de extracción documental e IA
aquachile.ia.zona-horaria=America/Santiago
aquachile.ia.pdf.max-bytes=5242880
aquachile.ia.pdf.max-paginas=15
aquachile.ia.pdf.max-caracteres-bloque=24000
aquachile.ia.pdf.max-bloques=3
aquachile.ia.groq.connect-timeout-ms=10000
aquachile.ia.groq.read-timeout-ms=60000
aquachile.ia.groq.max-completion-tokens=6144
aquachile.ia.groq.max-reintentos=2

# Configuración JWT (HS256 + Cookie HttpOnly)
jwt.secret=${JWT_SECRET:aquachile-clave-desarrollo-local-minimo-32-bytes-2026}
jwt.issuer=${JWT_ISSUER:aquachile-api}
jwt.ttl-minutes=${JWT_TTL_MINUTES:20}
jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

# Código opcional para habilitar registro interno controlado
aquachile.auth.invite-code=${AQUACHILE_INVITE_CODE:}