spring.application.name=proyectoAquachile
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]


# Base de datos MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aquachile_db?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# Credenciales de demostración (siempre desde entorno en despliegue)
AQUACHILE_ANALISTA_PASSWORD=${AQUACHILE_ANALISTA_PASSWORD:admin123}
AQUACHILE_EVALUADOR_PASSWORD=${AQUACHILE_EVALUADOR_PASSWORD:user123}

# Límite de archivos CV (PDF, DOC y DOCX)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Configuración de Gmail SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Configuración de IA - Groq API (modelo explícito, sin selección dinámica)
groq.api.key=${GROQ_API_KEY:}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.api.model=${GROQ_API_MODEL:openai/gpt-oss-120b}

spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# Parámetros operativos de extracción documental e IA
aquachile.ia.zona-horaria=America/Santiago
aquachile.ia.pdf.max-bytes=5242880
aquachile.ia.pdf.max-paginas=15
aquachile.ia.pdf.max-caracteres-bloque=24000
aquachile.ia.pdf.max-bloques=3
aquachile.ia.groq.connect-timeout-ms=10000
aquachile.ia.groq.read-timeout-ms=60000
aquachile.ia.groq.max-completion-tokens=6144
aquachile.ia.groq.max-reintentos=2
